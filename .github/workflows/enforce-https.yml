name: Enforce HTTPS after DNS check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enforce-https.yml'
      - 'CNAME'

permissions:
  contents: read
  pages: write

jobs:
  wait-and-enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Poll DNS check status (up to 10 attempts, 30s each)
        run: |
          for i in $(seq 1 10); do
            echo "=== Attempt $i/10 ==="
            RESPONSE=$(curl -s -X GET \
              "https://api.github.com/repos/shuohui-air-technology/shuohui-pages/pages/health" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json")
            
            echo "Response: $RESPONSE"
            
            STATUS=$(echo "$RESPONSE" | python3 -c "
      import sys,json
      try:
          data = json.load(sys.stdin)
          if 'domain' in data:
              d = data['domain']
              if d and d.get('status') == 'verified':
                  print('VERIFIED')
              elif d and d.get('status') == 'pending':
                  print('PENDING')
              else:
                  print('UNKNOWN')
          else:
              print('NO_DOMAIN')
      except:
          print('ERROR')
      ")
            
            if [ "$STATUS" = "VERIFIED" ]; then
              echo "DNS check PASSED!"
              break
            fi
            
            if [ $i -eq 10 ]; then
              echo "Giving up after 10 attempts."
              exit 1
            fi
            
            echo "DNS still pending, waiting 30s..."
            sleep 30
          done
      
      - name: Enforce HTTPS
        run: |
          curl -s -X PUT \
            "https://api.github.com/repos/shuohui-air-technology/shuohui-pages/pages" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{
              "cname": "shuohui.uk",
              "source": {
                "branch": "main",
                "path": "/"
              },
              "https_enforced": true
            }'