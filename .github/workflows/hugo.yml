name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install locked build dependencies
        run: |
          python3 -m pip install -r requirements-build.txt
          npm ci --prefix editor

      - name: Bootstrap PaperMod theme
        run: python3 scripts/bootstrap_theme.py

      - name: Sync section registry
        run: python3 scripts/sync_sections.py

      - name: Check generated section files
        run: python3 scripts/sync_sections.py --check

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.2'
          extended: true

      - name: Validate author source without rewriting it
        run: |
          python3 scripts/content_tools.py validate content

      - name: Verify locally pinned editor and CMS assets
        run: |
          npm --prefix editor run check:bundle
          python3 scripts/build_cms.py --check

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs editor/test/unit/*.test.mjs cloudflare-gateway/index.test.js

      - name: Build
        run: python3 scripts/build_editor_site.py --public public

      - name: Check generated outputs
        run: |
          # The builder has already checked HTML, redirects, drafts, all assets
          # and the inventory against the same prepared content directory.
          git diff --exit-code -- content

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
