name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Bootstrap PaperMod theme
        run: python3 scripts/bootstrap_theme.py

      - name: Sync section registry
        run: python3 scripts/sync_sections.py

      - name: Check generated section files
        run: python3 scripts/sync_sections.py --check

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.2'
          extended: true

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/mathjax-config.test.mjs tests/mathjax-loader.test.mjs tests/mathjax-preview.test.mjs tests/markdown-format.test.mjs cloudflare-gateway/index.test.js

      - name: Normalize and validate content
        run: |
          python3 scripts/content_tools.py normalize content
          python3 scripts/content_tools.py validate content

      - name: Build
        run: hugo --minify --gc --buildFuture

      - name: Check generated outputs
        run: |
          hugo list all > /tmp/shuohui-hugo-list.csv
          python3 scripts/check_build.py --public public \
            --sections data/sections.json \
            --content content \
            --hugo-list /tmp/shuohui-hugo-list.csv \
            --required acgn/index.html \
            --required math/index.html \
            --required admin/index.html \
            --required admin/config.yml \
            --required admin/markdown-format.js \
            --required admin/mathjax-preview.js \
            --required js/mathjax-config.js \
            --required sitemap.xml
          python3 scripts/check_content_outputs.py \
            --public public \
            --hugo-list /tmp/shuohui-hugo-list.csv

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
