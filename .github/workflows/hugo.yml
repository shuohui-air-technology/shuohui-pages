name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Bootstrap PaperMod theme
        run: python3 scripts/bootstrap_theme.py

      - name: Sync section registry
        run: python3 scripts/sync_sections.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.2'
          extended: true

      - name: Normalize and validate content
        run: |
          python3 scripts/content_tools.py normalize content
          python3 scripts/content_tools.py validate content

      - name: Build
        run: hugo --minify --gc --buildFuture

      - name: Check generated outputs
        run: |
          python3 scripts/check_build.py --public public \
            --sections data/sections.json \
            --required acgn/index.html \
            --required math/index.html \
            --required sitemap.xml \
            --required 'acgn/2026-06-07-atri/index.html' \
            --forbidden 'acgn/我们终将走向悲伤-解构主义之殇/index.html'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
