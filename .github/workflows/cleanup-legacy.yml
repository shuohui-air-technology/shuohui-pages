name: Cleanup Legacy Workflows
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-legacy.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove deprecated workflows
        run: |
          rm -f .github/workflows/enable-discussions.yml
          rm -f .github/workflows/enforce-https.yml
          rm -f .github/workflows/cloudflare-dns.yml
          rm -f .github/workflows/cleanup-legacy.yml

      - name: Commit and push removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: clean up deprecated legacy workflows"
          git push