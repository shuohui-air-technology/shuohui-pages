name: Configure Cloudflare DNS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-dns.yml'

jobs:
  dns-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set CNAME records for shuohui.uk
        run: |
          # Get Zone ID
          ZONE_RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=shuohui.uk" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")
          
          ZONE_ID=$(echo "$ZONE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "Zone ID: $ZONE_ID"
          
          # List existing DNS records
          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")
          
          # Helper: create record if not exists
          create_if_missing() {
            local NAME=$1
            local TARGET=$2
            local MATCH=$(echo "$EXISTING" | python3 -c "
      import sys,json
      records=json.load(sys.stdin)['result']
      for r in records:
          if r['name']=='${NAME}.shuohui.uk' or (r['name']=='shuohui.uk' and '${NAME}'=='@'):
              print(r['id'])
              break
      ")
            if [ -n "$MATCH" ]; then
              echo "Record ${NAME} already exists (id: $MATCH), updating target..."
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${MATCH}" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"CNAME\",\"name\":\"${NAME}\",\"content\":\"${TARGET}\",\"proxied\":true,\"ttl\":1}"
            else
              echo "Creating record ${NAME} -> ${TARGET}..."
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"CNAME\",\"name\":\"${NAME}\",\"content\":\"${TARGET}\",\"proxied\":true,\"ttl\":1}"
            fi
          }
          
          create_if_missing "@" "shuohui-air-technology.github.io"
          create_if_missing "www" "shuohui.uk"