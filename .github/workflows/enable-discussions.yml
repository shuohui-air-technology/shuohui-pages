name: Enable Discussions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-discussions.yml'

permissions:
  administration: write

jobs:
  enable-discussions:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Discussions on repo
        run: |
          RESPONSE=$(curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/shuohui-air-technology/shuohui-pages \
            -d '{"has_discussions":true}')
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Discussions enabled:', d.get('has_discussions', 'unknown'))"

      - name: Fetch discussion categories
        run: |
          sleep 5
          CATS=$(curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/shuohui-air-technology/shuohui-pages/discussions/categories")
          echo "=== Discussion Categories ==="
          echo "$CATS" | python3 -c "
      import sys,json
      data=json.load(sys.stdin)
      for c in data:
          print(f'  Name: {c[\"name\"]:20s}  ID: {c[\"node_id\"]}  Slug: {c[\"slug\"]}')
      "