name: Enable Discussions
on:
  workflow_dispatch:

permissions:
  administration: write

jobs:
  enable-discussions:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Discussions on repo
        run: |
          RESPONSE=$(curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/shuohui-air-technology/shuohui-pages \
            -d '{"has_discussions":true}')
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Discussions enabled:', d.get('has_discussions', 'unknown'))"