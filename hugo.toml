baseURL = "https://shuohui.uk/"
locale = "zh-CN"
title = "朔卉的数字空间"
theme = "PaperMod"

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  math = false
  giscus = true
  comments = true
  mainSections = []

  [params.homeInfoParams]
    Title = "朔卉 (shuohui)"
    Content = "A LLM lover and applied mathematician, my dream is to build an ATRI."

  [params.profileMode]
    enabled = false

[[params.socialIcons]]
    name = "github"
    url = "https://github.com/shuohui-air-technology"
[[params.socialIcons]]
    name = "email"
    url = "mailto:a0921652310@gmail.com"

[markup.goldmark.extensions]
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["$", "$"], ["\\(", "\\)"]]
