editor:
  preview: true

backend:
  name: github
  repo: shuohui-air-technology/shuohui-pages
  branch: main
  base_url: https://shuohui-cms-oauth.shuohui.workers.dev/
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "独立页面管理 (Pages)"
    files:
      - label: "博客主页 (Home)"
        name: "home"
        file: "content/_index.md"
        fields:
          - {label: "主页大标题", name: "title", widget: "string"}
          - {label: "主页正文介绍", name: "body", widget: "markdown"}

  - name: "sections"
    label: "板块管理"
    files:
      - label: "板块列表"
        name: "sections"
        file: "data/sections.json"
        fields:
          - label: "板块"
            name: "sections"
            widget: "list"
            summary: "{{fields.name}} ({{fields.slug}})"
            fields:
              - label: "板块名称"
                name: "name"
                widget: "string"
              - label: "稳定 Slug（例如 travel）"
                name: "slug"
                widget: "string"
                pattern:
                  - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                  - "只能使用小写英文、数字和短横线"
              - label: "导航排序数字"
                name: "weight"
                widget: "number"
                value_type: "int"
                min: 0
              - label: "是否默认开启公式"
                name: "math"
                widget: "boolean"

  - name: "math"
    label: "学术推导与笔记"
    folder: "content/math"
    create: true
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss"}
      - {label: "是否开启公式(LaTeX)", name: "math", widget: "boolean", default: true}
      - {label: "是否为草稿", name: "draft", widget: "boolean", default: false}
      - {label: "是否开启评论", name: "comments", widget: "boolean", default: true}
      - label: "文章封面 (Cover)"
        name: "cover"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - {label: "上传图片", name: "image", widget: "image", required: false}
          - {label: "图片替代文字(Alt)", name: "alt", widget: "string", required: false}
          - {label: "使用相对路径", name: "relative", widget: "boolean", default: true, required: false}
      - {label: "正文内容", name: "body", widget: "markdown"}

  - name: "acgn"
    label: "随笔"
    folder: "content/acgn"
    create: true
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss"}
      - {label: "是否开启公式(LaTeX)", name: "math", widget: "boolean", default: false}
      - {label: "是否为草稿", name: "draft", widget: "boolean", default: false}
      - {label: "是否开启评论", name: "comments", widget: "boolean", default: true}
      - label: "文章封面 (Cover)"
        name: "cover"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - {label: "上传图片", name: "image", widget: "image", required: false}
          - {label: "图片替代文字(Alt)", name: "alt", widget: "string", required: false}
          - {label: "使用相对路径", name: "relative", widget: "boolean", default: true, required: false}
      - {label: "正文内容", name: "body", widget: "markdown"}

