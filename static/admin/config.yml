backend:
  name: github
  repo: shuohui-air-technology/shuohui-pages
  branch: main
  base_url: https://shuohui-cms-oauth.shuohui.workers.dev/
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "独立页面管理 (Pages)"
    files:
      - label: "博客主页 (Home)"
        name: "home"
        file: "content/_index.md"
        fields:
          - {label: "主页大标题", name: "title", widget: "string"}
          - {label: "主页正文介绍", name: "body", widget: "markdown"}

  - name: "math"
    label: "学术推导与笔记"
    folder: "content/math"
    create: true
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "是否开启公式(LaTeX)", name: "math", widget: "boolean", default: true}
      - {label: "是否为草稿", name: "draft", widget: "boolean", default: false}
      - {label: "是否开启评论", name: "comments", widget: "boolean", default: true}
      - label: "文章封面 (Cover)"
        name: "cover"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - {label: "上传图片", name: "image", widget: "image", required: false}
          - {label: "图片替代文字(Alt)", name: "alt", widget: "string", required: false}
          - {label: "使用相对路径", name: "relative", widget: "boolean", default: true, required: false}
      - {label: "正文内容", name: "body", widget: "markdown"}

  - name: "acgn"
    label: "二次元与随笔"
    folder: "content/acgn"
    create: true
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "是否开启公式(LaTeX)", name: "math", widget: "boolean", default: false}
      - {label: "是否为草稿", name: "draft", widget: "boolean", default: false}
      - {label: "是否开启评论", name: "comments", widget: "boolean", default: true}
      - label: "文章封面 (Cover)"
        name: "cover"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - {label: "上传图片", name: "image", widget: "image", required: false}
          - {label: "图片替代文字(Alt)", name: "alt", widget: "string", required: false}
          - {label: "使用相对路径", name: "relative", widget: "boolean", default: true, required: false}
      - {label: "正文内容", name: "body", widget: "markdown"}
