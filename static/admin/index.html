<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuohui CMS</title>
    <script src="/js/mathjax-config.js"></script>
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script src="/admin/mathjax-preview.js"></script>
    <script>
      (function () {
        function startPreview() {
          if (!window.ShuohuiMathJaxPreview || !window.ShuohuiMathJaxPreview.startBrowserController) {
            return;
          }

          window.ShuohuiMathJaxPreview.startBrowserController(window);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startPreview, { once: true });
        } else {
          startPreview();
        }
      })();
    </script>
  </body>
</html>
