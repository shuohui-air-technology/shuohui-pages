<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuohui CMS</title>
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        }
      };
    </script>
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      (function () {
        var typing = false;
        var debounceTimer = null;
        var pollTimer = null;
        var DEBOUNCE_MS = 300;
        var mathjaxInjected = false;

        function typesetInline() {
          if (typeof MathJax === 'undefined' || !MathJax.typesetPromise) return;
          var el = document.querySelector('[role="document"]');
          if (!el) return;
          if (typing) return;
          typing = true;
          MathJax.typesetPromise([el]).then(function () {
            typing = false;
          }).catch(function () {
            typing = false;
          });
        }

        function typesetIframe() {
          var el = document.querySelector('[role="document"]');
          if (!el || el.tagName !== 'IFRAME') return;
          try {
            var doc = el.contentDocument;
            if (!doc) return;
            var win = el.contentWindow;
            if (win && win.MathJax && win.MathJax.typesetPromise) {
              if (typing) return;
              typing = true;
              win.MathJax.typesetPromise().then(function () {
                typing = false;
              }).catch(function () {
                typing = false;
              });
              return;
            }
            if (!mathjaxInjected) {
              var cfg = doc.createElement('script');
              cfg.textContent = 'MathJax={tex:{inlineMath:[["$","$"],["\\\\(","\\\\)"]],displayMath:[["$$","$$"],["\\\\[","\\\\]"]],processEscapes:true,processEnvironments:true},options:{skipHtmlTags:["script","noscript","style","textarea","pre"]}};';
              doc.head.appendChild(cfg);
              var s = doc.createElement('script');
              s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
              s.async = true;
              doc.head.appendChild(s);
              mathjaxInjected = true;
            }
          } catch (e) {}
        }

        function scheduleTypeset() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(function () {
            var el = document.querySelector('[role="document"]');
            if (!el) return;
            if (el.tagName === 'IFRAME') {
              typesetIframe();
            } else {
              typesetInline();
            }
          }, DEBOUNCE_MS);
        }

        function observe(target) {
          new MutationObserver(function () {
            scheduleTypeset();
          }).observe(target, { childList: true, subtree: true, characterData: true });
        }

        function trySetup() {
          var el = document.querySelector('[role="document"]');
          if (!el) {
            pollTimer = setTimeout(trySetup, 1000);
            return;
          }
          if (el.tagName === 'IFRAME') {
            el.addEventListener('load', function () {
              mathjaxInjected = false;
              try {
                var doc = el.contentDocument;
                if (doc && doc.body) {
                  observe(doc.body);
                }
              } catch (e) {}
            });
            try {
              var doc = el.contentDocument;
              if (doc && doc.body) {
                observe(doc.body);
              }
            } catch (e) {}
            pollTimer = setTimeout(trySetup, 2000);
          } else {
            observe(el);
            pollTimer = setTimeout(trySetup, 2000);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', trySetup);
        } else {
          trySetup();
        }
      })();
    </script>
  </body>
</html>
