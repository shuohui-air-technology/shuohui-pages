<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuohui CMS</title>
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        }
      };
    </script>
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      (function () {
        var PREVIEW_SEL = '[role="document"]';
        var POLL_MS = 1000;
        var lastContent = '';
        var typing = false;
        var mathjaxInjected = false;

        function getPreview() {
          return document.querySelector(PREVIEW_SEL);
        }

        function isIframe(el) {
          return el && el.tagName === 'IFRAME';
        }

        function typesetMain() {
          if (typeof MathJax === 'undefined' || !MathJax.typesetPromise) return;
          var el = getPreview();
          if (!el || isIframe(el) || typing) return;
          typing = true;
          MathJax.typesetPromise([el]).then(function () {
            typing = false;
          }).catch(function () { typing = false; });
        }

        function injectMathJaxIntoIframe(iframe) {
          if (mathjaxInjected) return;
          try {
            var doc = iframe.contentDocument;
            if (!doc || !doc.head) return;
            var cfg = doc.createElement('script');
            cfg.textContent = 'MathJax={tex:{inlineMath:[["$","$"],["\\\\(","\\\\)"]],displayMath:[["$$","$$"],["\\\\[","\\\\]"]],processEscapes:true,processEnvironments:true},options:{skipHtmlTags:["script","noscript","style","textarea","pre"]}};';
            doc.head.appendChild(cfg);
            var s = doc.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
            s.async = true;
            doc.head.appendChild(s);
            mathjaxInjected = true;
          } catch (e) {}
        }

        function typesetIframe(iframe) {
          try {
            var win = iframe.contentWindow;
            if (win && win.MathJax && win.MathJax.typesetPromise) {
              if (typing) return;
              typing = true;
              win.MathJax.typesetPromise().then(function () {
                typing = false;
              }).catch(function () { typing = false; });
              return true;
            }
          } catch (e) {}
          return false;
        }

        function poll() {
          var el = getPreview();
          if (!el) {
            setTimeout(poll, POLL_MS);
            return;
          }

          if (isIframe(el)) {
            injectMathJaxIntoIframe(el);
            typesetIframe(el);
          } else {
            var content = el.innerHTML;
            if (content !== lastContent) {
              lastContent = content;
              typesetMain();
            }
          }

          setTimeout(poll, POLL_MS);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', poll);
        } else {
          poll();
        }
      })();
    </script>
  </body>
</html>
